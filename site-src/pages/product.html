---
title: Product
desc: Fit & Flex product details, pack sizes and ingredients.
page: shop
---
<section class="wrap" style="padding:2.5rem 0 5rem" id="pdpRoot">
  <div class="crumbs" style="margin-bottom:1.5rem"><a href="index.html">Home</a><span>/</span><a href="shop.html">Shop</a><span>/</span><span id="crumbName">Product</span></div>
  <div id="pdp"></div>
</section>
<section class="sec" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head"><h2>You might <span class="accent">also like</span></h2></div>
    <div class="grid" id="related"></div>
  </div>
</section>
<div class="buybar" id="buybar" aria-hidden="true"><div><b id="bbPrice"></b><br><small id="bbName" style="color:var(--ink-3)"></small></div><button class="btn btn-primary" id="bbAdd">Add to bag</button></div>
---script---
<script>
const id = new URLSearchParams(location.search).get("id");
const p = FF.byId(id);
const root = document.getElementById("pdp");
if (!p) {
  root.innerHTML = `<div class="notfound"><h2>We could not find that product</h2><p class="lead">It may have been renamed or moved. The full range is one click away.</p><a class="btn btn-navy" href="shop.html">Go to the shop</a></div>`;
  FF.renderGrid(document.getElementById("related"), FF.PRODUCTS.slice(0,4));
} else {
  document.title = `${p.name} | Fit & Flex`;
  document.getElementById("crumbName").textContent = p.name;
  const cover = p.cover ? "cover" : "";
  root.innerHTML = `<div class="pdp">
    <div class="gallery" style="--tint:${p.tint}">
      <div class="main" id="mainWrap"><img id="mainImg" class="${cover}" src="${FF.IMG(p.images[0])}" alt="${p.name}" width="700" height="700"></div>
      ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((im,i)=>`<button type="button" data-img="${im}" aria-pressed="${i===0}" aria-label="Image ${i+1}"><img class="${(cover||i>0)?"cover":""}" src="${FF.IMG(im)}" alt=""></button>`).join("")}</div>` : ""}
    </div>
    <div class="pinfo">
      ${p.tag ? `<span class="eyebrow">${p.tag}</span>` : ""}
      <h1>${p.name}</h1>
      <p class="lead">${p.blurb}</p>
      <span class="price" id="pPrice">${FF.fmt(p.price[p.sizes[0]])} <small>/ ${p.sizes[0]}</small></span>
      <div class="sizes" role="group" aria-label="Pack size" id="pSizes">${p.sizes.map((s,i)=>`<button type="button" data-size="${s}" aria-pressed="${i===0}">${s}</button>`).join("")}</div>
      <div class="qtyrow">
        <div class="qty"><button type="button" id="qm" aria-label="Decrease quantity">−</button><span id="qv">1</span><button type="button" id="qp" aria-label="Increase quantity">+</button></div>
        <button class="btn btn-primary" id="pAdd" data-add="${p.id}" data-size="${p.sizes[0]}" data-qty="#qv">Add to bag</button>
      </div>
      <ul class="claims">${p.claims.map((c,i)=>`<li class="reveal" style="--i:${i}"><svg class="ico" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg>${c}</li>`).join("")}</ul>
      <details open><summary>Ingredients</summary><p>${p.ingredients}</p></details>
      <details><summary>How to eat it</summary><ul><li>With cold milk or curd, no cooking needed.</li><li>Over fruit, smoothie bowls or yoghurt.</li><li>Straight from the pouch. Reseal the zip lock to keep the crunch.</li></ul></details>
      <details><summary>Delivery and returns</summary><p>Ships across India in 2 to 5 working days. Free delivery on orders above &#8377;499. Unopened packs can be returned within 7 days of delivery.</p></details>
    </div></div>`;
  root.querySelectorAll(".reveal").forEach(FF.observe);
  const main = document.getElementById("mainImg"), wrap = document.getElementById("mainWrap");
  wrap.addEventListener("pointermove", e => { const r = wrap.getBoundingClientRect(); wrap.style.setProperty("--ox", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%"); wrap.style.setProperty("--oy", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%"); });
  root.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => { main.src = FF.IMG(b.dataset.img); main.className = (cover || b.dataset.img !== p.images[0]) ? "cover" : ""; root.querySelectorAll(".thumbs button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const sizes = document.getElementById("pSizes"), price = document.getElementById("pPrice"), addBtn = document.getElementById("pAdd");
  const bb = document.getElementById("buybar"), bbAdd = document.getElementById("bbAdd"), bbPrice = document.getElementById("bbPrice");
  document.getElementById("bbName").textContent = p.name; bbPrice.textContent = FF.fmt(p.price[p.sizes[0]]);
  bbAdd.dataset.add = p.id; bbAdd.dataset.size = p.sizes[0]; bbAdd.dataset.qty = "#qv";
  sizes.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sizes.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); price.innerHTML = `${FF.fmt(p.price[b.dataset.size])} <small>/ ${b.dataset.size}</small>`; addBtn.dataset.size = b.dataset.size; bbAdd.dataset.size = b.dataset.size; bbPrice.textContent = FF.fmt(p.price[b.dataset.size]); });
  const qv = document.getElementById("qv");
  document.getElementById("qm").onclick = () => qv.textContent = Math.max(1, +qv.textContent - 1);
  document.getElementById("qp").onclick = () => qv.textContent = Math.min(10, +qv.textContent + 1);
  new IntersectionObserver(es => es.forEach(en => { bb.classList.toggle("show", !en.isIntersecting && en.boundingClientRect.top < 0); }), { threshold: 0 }).observe(addBtn);
  const rel = FF.PRODUCTS.filter(x => x.id !== p.id && x.cat === p.cat).slice(0,4);
  FF.renderGrid(document.getElementById("related"), rel.length >= 2 ? rel : FF.PRODUCTS.filter(x => x.id !== p.id).slice(0,4));
}
</script>
